<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامج تحليل الفجوة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#d9dde3;--pr:#1f3864;--ok:#1e8e4e;--okb:#e2f5ea;--no:#c62828;--nob:#fde8e8;--hd:#e6ecf7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mu:#9aa1ad;--bd:#343943;--pr:#8fb0ee;--ok:#5ad08a;--okb:#16301f;--no:#ff8a8a;--nob:#3a1b1b;--hd:#262c38}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;text-align:center;margin:8px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prog{height:8px;background:var(--bd);border-radius:4px;flex:1;min-width:100px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pr);width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--pr);background:var(--pr);color:#fff;border-radius:8px;padding:6px 14px}
button.sec{background:transparent;color:var(--pr)}
h2{font-size:1.1rem;margin:22px 0 6px;text-decoration:underline}
.cat{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;overflow:hidden}
.cat h3{margin:0;padding:8px 12px;background:var(--hd);font-size:.98rem}
.row{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
.row .n{color:var(--mu);min-width:24px}.row .t{flex:1;min-width:200px}
.row.ok{background:var(--okb)}.row.no{background:var(--nob)}
.opt{display:flex;gap:6px}.opt label{border:1px solid var(--bd);border-radius:16px;padding:2px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap;background:var(--card)}
.opt input{display:none}.opt label.a:has(input:checked){background:var(--ok);color:#fff;border-color:var(--ok)}.opt label.b:has(input:checked){background:var(--no);color:#fff;border-color:var(--no)}
.new{font-size:.7rem;background:var(--pr);color:var(--bg);border-radius:4px;padding:0 5px}
.add{display:flex;gap:6px;padding:8px 12px;border-top:1px dashed var(--bd)}
input[type=text]{flex:1;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
.x{background:transparent;color:var(--no);border-color:var(--no);padding:0 8px}
#res{display:none;margin-top:20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{border-radius:12px;padding:14px;text-align:center;font-size:.95rem}.st b{display:block;font-size:2rem}
.st.ok{background:var(--okb);color:var(--ok)}.st.no{background:var(--nob);color:var(--no)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.col{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
.col h4{margin:0 0 6px}.col ol{margin:0;padding-inline-start:20px;font-size:.88rem}.col li{margin-bottom:4px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-top:10px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
@media print{.bar,.add,.opt,.x,#main{display:none!important}#res{display:block!important}}
</style></head><body><div class="wrap">
<h1>برنامج تحليل الفجوة</h1>
<div class="bar"><span id="cnt"></span><div class="prog"><i id="pg"></i></div>
<button id="fin">إنهاء وعرض النتيجة</button><button class="sec" id="rst">مسح الكل</button></div>
<div id="main"></div>
<div id="res"></div></div>
<script>
const DATA=[{"t":"أولاً: (مخزن 3) وتتمثل في الآتي:","cats":[{"n":"النظافات","r":["عدم نظافة منطقة غسيل الأيدي حيث يوجد جوانتيات وأغطية رأس مُلقاة","عدم نظافة الدارفيل الخاص بماكينة تشكيل الصوابع","تراكم المعدات الغير مستخدمة داخل مخزن 3 وتراكم الأتربة على الشرنك وكذلك بقسم البيتي فور","عدم نظافة الأرفف الحديدية الموجودة بمنطقة التصنيع الخاصة بالصوابع","عدم نظافة الأسبتة المستخدمة في تعبئة منتجات البيتي فور حيث يوجد اتساخات عليها","انبعاث روائح كريهة من بالوعة الصرف الموجودة عند ثلاجة تخزين الخامات"]},{"n":"الصيانة والمعدات","r":["تراكم المعدات أمام المصنع وعدم وضعها في الأماكن المخصصة لها","عطل في بعض الأحواض الموجودة في منطقة التعقيم","تسريب من مواسير الصرف الخاصة بأحواض غسيل الأيدي","عدم وجود سلك على الشبابيك الموجودة في منطقة غسيل الأيدي وبالتالي احتمالية دخول آفات إلى مناطق الإنتاج","استخدام باليتات خشبية غير معالجة وبها تهالك داخل مناطق الإنتاج ولا توجد آلية لتنظيف بها","عطل في بعض المصائد الضوئية في جميع أنحاء المصنع مع ضرورة توافر كروت متابعة لكل مصيدة","استخدام مقاطع ملفوف عليها لاصق في منطقة التصنيع الخاصة بالصوابع","مراعاة معايرة جميع الأفران بمصنع أبوروداش والتأكد من عزل وتمييز الفرن غير المعاير","عطل في المناخل المستخدمة لنخل الدقيق","عدم وجود مسامير في الحمّان الموجود بمنطقة عجين البسكوت AD03 وعدم نظافته ووجود تشقير على الحمّان ذاته","وجود لحامات على ماكينة فرم المكسرات كود BI03 (ملحوظة سابقة)","تهالك في شرائط السيليكون الخاص بمنتجات البسكوت وعدم عزلها","تهالك في بعض أجزاء الستائر البلاستيكية الموجودة على مدخل قسم عجين البسكوت","استخدام أدوات البلاستيك في نقل الخامات داخل الأفران (يرجى استبدالها بالاستانلس غير القابل للصدأ)","تقليل في سير التعبئة الموجودة بمنطقة البيتي فور","صدأ على القراءة الموجودة بمنطقة البيتي فور كود Ac03","وجود أكواب زجاجية داخل ورش الصيانة"]},{"n":"أشخاص","r":["وجود أعقاب سجائر في منطقة الهايجين على الرغم من وجود منطقة مخصصة لذلك","عدم ارتداء العاملين للمهمات الوقائية خلال فتح منتجات المولد في منطقة التصنيع الخاصة بالصوابع","غسيل معدات النظافة من قبل العامل المؤقت داخل حوض غسيل المعدات","فك البيض بطريقة غير صحيحة حيث يتم فكه عند منطقة الأفران","ارتداء أحد العاملين بقسم عجين البسكوت لخاتم وكذلك سماعة أذن"]},{"n":"ملاحظات تشغيلية","r":["وجود الأسبتة والصناديق الخاصة بنقل المنتجات في الطريق العام وعدم عزلها بعيداً عن أماكن التلوث","عدم إحكام غلق البالونات الموجودة في منطقة غسيل الأيدي","عدم تجربة ديسبنسرات التطهير الموجودة في منطقة غسيل الأيدي","تخزين مواد التعبئة والتنظيف ملاصقة للحوائط وبالتالي صعوبة إجراء عمليات التنظيف والتطهير","عدم وجود دليل لتعليمات النظافة والتطهير على بعض المعدات الموجودة بأماكن التصنيع","وضع استيكرات المنتجات داخل منطقة المنتجات الغير مطابقة وعدم فصلها وتمييزها وعزلها في منطقة التصنيع الخاصة بالصوابع","عدم توافر الكراتين الخاصة بالخامات الوسيطة المستخدمة والاكتفاء بكارت التمييز فقط (تم التنبيه على ضرورة توفير كافة الفوارغ لتتطابق مع الكارت الموجود على الخامة)","عدم الفصل الجيد بين الأدوات والمعدات المستخدمة في المواد المسببة للحساسية حيث يتم استخدام معدات الفول السوداني لمنتجات اللوز","وضع صاجات الفوليه مع منتجات التوزيعة في نفس الصباح وعدم الفصل بين المواد المسببة للحساسية عن بعضها","وجود بقايا منتجات وتغليف (ورق ناتج عن حلوى المولد (قرص حمص مكسر))","عدم تمييز الصاجات الموجودة بها الخامات الوسيطة لمختلف المنتجات","عدم وجود كارت تمييز على عبوة زيت حيث لا يوجد عليها أي تاريخ صلاحية في منطقة التصنيع الخاصة بالصوابع","تراكم القباس وورق على الشفاطات وبالتالي صعوبة إجراء عملها بالكفاءة اللازمة (عدم نظافة معظم شفاطات صالة الإنتاج)","وجود أجزاء من المعدات على المنتجات وعدم وضعها في الأماكن المخصصة لها","وضع الكسر في غير الأماكن المخصصة له حيث يتم وضعه بجانب المنتجات الصالحة للتشغيل في منطقة التصنيع الخاصة بالصوابع","وجود أجزاء بلاستيكية داخل جرادل الحمل في منطقة التصنيع الخاصة بالصوابع","وضع الفول السوداني داخل جرادل شكائر السكر وبالتالي مخالفة البيانات","وضع المنتجات والخامات على الأرض مباشرة","وجود جرادل بها مياه غير نظيفة خلف الأفران","عدم إحكام غلق خط الصرف الموجود أسفل حوض غسيل الأدوات الموجود عند منطقة الأفران","عدم وجود سلات قمامة تفتح بالقدم داخل جميع الأقسام","عدم تفعيل تعليمة التخلص من نقل الخامات بشكائر الدقيق والسكر","وجود بعض المعدات المتون عليها كارت أصفر لعدم نظافتها + وجود كارت أصفر على السكر البودرة الباكت الموجود بمنطقة البيتي فور نتيجة مضي التاريخ ولم يتم اتخاذ قرار فيه إلى الآن","عدم الفصل بين الأدوات والخامات بمنطقة عجين البسكوت","عدم تشغيل الستائر الهوائية الموجودة على مدخل قسم البسكوت","طمس في كارت المعايرة الموجود على ميزان الأفران وكذلك بعض الموازين الموجودة بمنطقة البيتي فور","عدم استكمال البيانات الموجودة على شيكولاتة خام حيث لا يوجد سوى السنة فقط ولا يوجد شهر","وجود مواد كيميائية مثل صابون غسيل المعدات وكذلك الكحول داخل منطقة التعبئة بقسم بيتي فور وعدم عزلها في مكان منفصل","تخزين الخامات أسفل كباسات التبريد مع وجود أجزاء بلاستيكية في السقف","بالوعة الصرف الخاصة بأماكن الشرب الموجودة في مدخل القسم غير محكمة الغلق","عدم تفعيل غلق الورقيات المتطلة بكل قسم","عدم إحكام غلق الأبواب الموجودة بأماكن التصنيع"]}]},{"t":"ثانياً: (مخزن 4) وتتمثل في الآتي:","cats":[{"n":"الصيانة والمعدات","r":["سقوط قطع حديد بها صدأ على ترابيزة الإنتاج","كسر في مصيدة القوارض عند المدخل"]},{"n":"ملاحظات تشغيلية","r":["علب بدون أي بيانات خاصة بتجارب الصلاحية","عدم وجود بيانات على بعض أكياس البندق والفستق المخزنة على الرغم من أن شروط التخزين في درجة حرارة (-18)","قطع في كارت تمييز بندق محمص وغير واضح تاريخ الإنتاج","تخزين جيلي فواكه بطريقة مخالفة لشروط التخزين الخاصة به والمدونة على كارت البيانات حيث إن شروط التخزين المدونة عليه (-18)","انتهاء صلاحية فوليه اسبريد في منطقة المرتجعات بدون فصلها عن العبوات غير المنتهية الصلاحية","تخزين لوز أمريكي فاكيوم بطريقة مخالفة لشروط التخزين المدونة عليه حيث إن شروط التخزين له (-18)","عدم تمييز منطقة الكسر (فورم أو طحن الكسر) وعدم تمييز بعض الأسبتة","عدم تشغيل أحد المصائد الضوئية"]}]},{"t":"ثالثاً: ملاحظات خاصة بإدارة المخازن وتتمثل في الآتي: مخزن (4،5):","cats":[{"n":"النظافات","r":["ماكينة فلو باك غير نظيفة وعليها أتربة (مخزن5)","صناديق عليها أتربة (مخزن5)","وجود فضلات قطط (مخزن5)","عوارض الراكات غير مستخدمة وغير نظيفة (مخزن5)","عدم نظافة الباب الموجود بآخر المخزن (مخزن5)","مراوح غير نظيفة بالمخزن (مخزن5)","عدم نظافة الستائر البلاستيكية على مداخل المخازن","عدم نظافة الحوائط ووجود أتربة عليها (مخزن4)"]},{"n":"الصيانة والبنية التحتية والمعدات","r":["أدوات خاصة بالإنشاءات والصيانة ومسامير (مخزن5)","حديد واسطمبات تثبيت الركات متروكة مهملة (مخزن5)","فتحات في الأبواب تسمح بدخول الآفات والقوارض (مخزن5)","الصرف أمام المخازن غير مكتمل ووجود مياه راكدة","وجود بلي ومسامير في منطقة شاحن الريتش (مخزن4)","وجود لوكرات في المخزن (مخزن4)"]},{"n":"أشخاص","r":["دخول أفراد التوزيع بدون الالتزام بالشروط الصحية الجيدة (مخزن5)","نثر لزق المكافحة في الأرضيات دون تحديد المكان أو وضع مصيدة مغلقة (مخزن5)","مصليات الصلاة على استنادات الخامات (مخزن4)"]},{"n":"ملاحظات تشغيلية","r":["عدم الترتيب والتنظيم في المخازن ووجود ماكينات ومعدات مهملة وغير مستخدمة (مخزن5)","عدم الفصل بين تفتيح المرتجعات والتحضير والخامات (مخزن5)","وضع خامات reject مع منتجات (مخزن5)","عدم ترتيب المخزن ووجود الماكينات والبرطمانات الزجاج والخامات بمكان واحد (مخزن5)","وجود علب كرتون مهملة على باليتة أمام المكاتب (مخزن5)","وجود صاجات بجانب منطقة التوزيع عليها شرينك غير نظيف (مخزن5)","وجود المرتجعات بجانب القمامة (مخزن5)","عدم إحكام غلق الأبواب","عدم فصل منتج نهائي عن الخامات (البن والكاكاو) (مخزن4)"]}]},{"t":"رابعاً: ملاحظات خاصة بمناطق الغسيل وتتمثل في الآتي:","cats":[{"n":"النظافات","r":["عفن على بعض الأسبتة الغير مستخدمة والموجودة بمنطقة الغسيل"]},{"n":"أشخاص","r":["عدم شركة أو سحب البلاكات الغير نظيفة من منطقة الغسيل","أحذية على ماكينة تنظيف الصاجات والأسبتة مع وجود قمامة على الماكينة","وضع الملابس الشخصية أمام منطقة خروج البلاكات النظيفة"]},{"n":"ملاحظات تشغيلية","r":["امتلاء أشرطة المكافحة في منطقة الغسيل","وضع الأدوات التي تصلح للتشغيل بجانب الأخرى الغير صالحة للتشغيل في منطقة غسيل المعدات","وجود أدوات ومعدات متروكة غير مستخدمة تكون مأوى للحشرات داخل منطقة غسيل المعدات","وضع الأسبتة البيضاء الخاصة بالكوكيز بجانب المصائد الفرمونية","ترك ألواح السيليكون النظيفة الخاصة بمنتجات البسكوت في الشارع وعدم وضعها في الأماكن المخصصة لها لمنع وجود تلوث عرضي"]}]}];
let S={a:{},n:[]};
try{const s=localStorage.getItem("gap1");if(s)S=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem("gap1",JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=()=>{const L=[];DATA.forEach((s,si)=>s.cats.forEach((c,ci)=>{c.r.forEach((t,i)=>L.push({id:`${si}-${ci}-${i}`,t,sec:s.t,cat:c.n,nw:0}));S.n.filter(x=>x.k==`${si}-${ci}`).forEach(x=>L.push({id:x.id,t:x.t,sec:s.t,cat:c.n,nw:1}))}));return L};
function rowH(x,i){const v=S.a[x.id]||"";return `<div class="row ${v}" data-id="${x.id}"><span class="n">${i}</span><span class="t">${esc(x.t)} ${x.nw?'<span class="new">جديدة</span>':''}</span><span class="opt"><label class="a"><input type="radio" name="r${x.id}" value="ok" ${v=="ok"?"checked":""}> مستوفي</label><label class="b"><input type="radio" name="r${x.id}" value="no" ${v=="no"?"checked":""}> غير مستوفي</label></span>${x.nw?`<button class="x" data-del="${x.id}">✕</button>`:""}</div>`}
function render(){let h="";const L=all();DATA.forEach((s,si)=>{h+=`<h2>${s.t}</h2>`;s.cats.forEach((c,ci)=>{h+=`<div class="cat"><h3>${ci+1}. ${c.n}</h3>`;L.filter(x=>x.sec==s.t&&x.cat==c.n).forEach((x,i)=>h+=rowH(x,i+1));h+=`<div class="add"><input type="text" placeholder="إضافة ملاحظة جديدة..." data-in="${si}-${ci}"><button class="sec" data-add="${si}-${ci}">إضافة</button></div></div>`})});
document.getElementById("main").innerHTML=h;upd()}
function upd(){const L=all(),d=L.filter(x=>S.a[x.id]).length;document.getElementById("cnt").textContent=`تم تحديد ${d} من ${L.length}`;document.getElementById("pg").style.width=(L.length?d/L.length*100:0)+"%"}
document.addEventListener("change",e=>{const r=e.target.closest(".row");if(r&&e.target.type=="radio"){S.a[r.dataset.id]=e.target.value;r.className="row "+e.target.value;save();upd()}});
document.addEventListener("click",e=>{const t=e.target;
if(t.dataset.add){const inp=document.querySelector(`[data-in="${t.dataset.add}"]`),v=inp.value.trim();if(!v)return;S.n.push({id:"n"+Date.now(),k:t.dataset.add,t:v});save();render()}
if(t.dataset.del){S.n=S.n.filter(x=>x.id!=t.dataset.del);delete S.a[t.dataset.del];save();render()}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset.in){document.querySelector(`[data-add="${e.target.dataset.in}"]`).click()}});
document.getElementById("rst").onclick=()=>{if(confirm("مسح كل التحديدات والملاحظات الجديدة؟")){S={a:{},n:[]};save();render();document.getElementById("res").style.display="none"}};
document.getElementById("fin").onclick=()=>{const L=all(),ok=L.filter(x=>S.a[x.id]=="ok"),no=L.filter(x=>S.a[x.id]=="no"),un=L.length-ok.length-no.length;
if(un&&!confirm(`يوجد ${un} ملاحظة لم يتم تحديدها، وستُحسب النسب من إجمالي ${L.length} ملاحظة. هل تريد المتابعة؟`))return;
const p=n=>L.length?(n/L.length*100).toFixed(1):"0.0";
const li=a=>a.length?`<ol>${a.map(x=>`<li>${esc(x.t)}</li>`).join("")}</ol>`:"<span>لا يوجد</span>";
const nw=L.filter(x=>x.nw);
const r=document.getElementById("res");
r.innerHTML=`<h2>النتيجة النهائية</h2><div class="box">إجمالي الملاحظات: <b>${L.length}</b> (منها ${nw.length} جديدة)${un?` — غير محددة: ${un}`:""}</div>
<div class="stats" style="margin-top:10px"><div class="st ok"><b>${p(ok.length)}%</b>مستوفي (${ok.length})</div><div class="st no"><b>${p(no.length)}%</b>غير مستوفي (${no.length})</div></div>
<div class="cols"><div class="col"><h4>مستوفي</h4>${li(ok)}</div><div class="col"><h4>غير مستوفي</h4>${li(no)}</div></div>
<div class="box"><h4 style="margin:0 0 6px">الملاحظات الجديدة</h4>${nw.length?`<ol style="margin:0;padding-inline-start:20px;font-size:.88rem">${nw.map(x=>`<li>${esc(x.t)} — <b>${S.a[x.id]=="ok"?"مستوفي":S.a[x.id]=="no"?"غير مستوفي":"غير محدد"}</b> <small>(${esc(x.cat)})</small></li>`).join("")}</ol>`:"<span>لا توجد ملاحظات جديدة</span>"}</div>
<p style="text-align:center"><button onclick="window.print()">طباعة النتيجة</button></p>`;
r.style.display="block";r.scrollIntoView({behavior:"smooth"})};
render();
</script></body></html>
